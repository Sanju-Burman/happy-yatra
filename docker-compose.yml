version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: happy-yatra-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - PORT=9000
    env_file:
      - ./backend/.env
    networks:
      - happy-yatra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: happy-yatra-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - happy-yatra-net

networks:
  happy-yatra-net:
    driver: bridge
